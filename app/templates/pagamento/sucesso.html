<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento Confirmado</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; text-align: center; }
        h1 { color: #28a745; }
        p { font-size: 1.1em; }
        .check-mark { font-size: 5em; color: #28a745; }
    </style>
</head>
<body>
    <div class="check-mark">&#10004;</div>
    <h1>Pagamento Confirmado!</h1>
    <p>O sinal para o seu agendamento foi recebido com sucesso.</p>
    <p>Seu agendamento está <strong>confirmado</strong>.</p>
    <p><small>Você pode fechar esta página.</small></p>
</body>
</html>
